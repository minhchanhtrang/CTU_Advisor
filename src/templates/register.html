<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký – CTU Advisor</title>
    <meta name="description" content="Tạo tài khoản CTU Advisor – Trợ lý học vụ AI của Đại học Cần Thơ." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f6;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            object-fit: contain;
        }
        .app-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dce1e6;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background-color: #004494;
        }
        .auth-footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .auth-footer a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .auth-error {
            background: #ffe5e5;
            color: #d93025;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <img src="/static/CTU_logo.png" alt="Logo CTU" class="logo-img" />
        <h1 class="app-name">Đăng ký tài khoản</h1>
        
        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/register">
            <div class="form-group">
                <input class="form-input" type="text" name="full_name" placeholder="Họ và tên (Tùy chọn)" autocomplete="name" />
            </div>
            <div class="form-group">
                <input class="form-input" type="text" name="username" placeholder="Tên đăng nhập *" required autocomplete="username" minlength="3" />
            </div>
            <div class="form-group">
                <input class="form-input" type="password" name="password" placeholder="Mật khẩu *" required autocomplete="new-password" minlength="6" />
            </div>
            <div class="form-group">
                <input class="form-input" type="password" name="confirm_password" placeholder="Xác nhận mật khẩu *" required autocomplete="new-password" />
            </div>
            <button class="auth-btn" type="submit">Tạo tài khoản</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="/auth/login">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
